<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="+900 sentencias comentadas, 20 calculadoras laborales, Diario resumen del BOE, +25 proyectos propios">
  <g opacity="0">
    <animate attributeName="opacity" to="1" dur=".6s" begin="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur=".6s" begin="0.2s" fill="freeze"/>
    <rect x="20" y="14" width="225" height="112" rx="16" fill="#0d1a33" stroke="#60a5fa" stroke-opacity=".5"/>
    <text x="42" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#60a5fa">+900</text>
    <text x="42" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">sentencias comentadas</text>
    <rect x="42" y="110" height="3" rx="1.5" fill="#60a5fa" width="0"><animate attributeName="width" to="181" dur="1.2s" begin="0.5s" fill="freeze"/></rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" to="1" dur=".6s" begin="0.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur=".6s" begin="0.45s" fill="freeze"/>
    <rect x="265" y="14" width="225" height="112" rx="16" fill="#0d1a33" stroke="#818cf8" stroke-opacity=".5"/>
    <text x="287" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#818cf8">20</text>
    <text x="287" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">calculadoras laborales</text>
    <rect x="287" y="110" height="3" rx="1.5" fill="#818cf8" width="0"><animate attributeName="width" to="181" dur="1.2s" begin="0.75s" fill="freeze"/></rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" to="1" dur=".6s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur=".6s" begin="0.7s" fill="freeze"/>
    <rect x="510" y="14" width="225" height="112" rx="16" fill="#0d1a33" stroke="#c084fc" stroke-opacity=".5"/>
    <text x="532" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#c084fc">Diario</text>
    <text x="532" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">resumen del BOE</text>
    <rect x="532" y="110" height="3" rx="1.5" fill="#c084fc" width="0"><animate attributeName="width" to="181" dur="1.2s" begin="1s" fill="freeze"/></rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" to="1" dur=".6s" begin="0.95s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur=".6s" begin="0.95s" fill="freeze"/>
    <rect x="755" y="14" width="225" height="112" rx="16" fill="#0d1a33" stroke="#f472b6" stroke-opacity=".5"/>
    <text x="777" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f472b6">+25</text>
    <text x="777" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">proyectos propios</text>
    <rect x="777" y="110" height="3" rx="1.5" fill="#f472b6" width="0"><animate attributeName="width" to="181" dur="1.2s" begin="1.25s" fill="freeze"/></rect>
  </g>
</svg>